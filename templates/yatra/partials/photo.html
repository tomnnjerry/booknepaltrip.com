{% load yatra %}<figure class="photo {{ cls }}">{% if img %}<div class="photo__frame"><img src="{{ img|src:960 }}" srcset="{{ img|srcset }}" sizes="{{ sizes }}" alt="{{ alt }}" {% if eager %}fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async"></div>{% if credit %}<figcaption class="photo__credit">Photo: <a href="{{ img.source }}" rel="noopener">{{ img|short_credit }}</a>, Wikimedia Commons</figcaption>{% endif %}{% else %}<div class="photo__frame"><div class="noimg"></div></div>{% endif %}</figure>
