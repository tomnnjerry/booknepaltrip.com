<div class="months" role="list" aria-label="Best months">{% for m in bar %}{% if link_base %}<a role="listitem" class="v{{ m.v }}{% if forloop.counter0 == now %} is-now{% endif %}" href="{{ link_base }}{{ m.full|lower }}/" title="{{ m.full }} ({{ m.bs }})"><b>{{ m.m }}</b><small>{{ m.bs }}</small></a>{% else %}<span role="listitem" class="m v{{ m.v }}{% if forloop.counter0 == now %} is-now{% endif %}" title="{{ m.full }} ({{ m.bs }})"><b>{{ m.m }}</b><small>{{ m.bs }}</small></span>{% endif %}{% endfor %}</div>
<div class="months-key"><span><i style="background: var(--acc-ink)"></i>Best</span><span><i style="background: repeating-linear-gradient(135deg, var(--tint) 0 3px, #fff 3px 6px); box-shadow: inset 0 0 0 1px var(--rule)"></i>Good</span><span><i style="background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule)"></i>Avoid or closed</span><span>Second line: Nepali months (Bikram Sambat)</span></div>
