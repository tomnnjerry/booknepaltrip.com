{% load yatra %}<a class="card" href="{{ f.url }}" data-land="{{ f.region }}">
  <div class="card__img">{% with i=f|first_img %}{% if i %}<img src="{{ i|src:500 }}" alt="" loading="lazy">{% else %}<div class="noimg">{% icon "calendar" %}</div>{% endif %}{% endwith %}<span class="card__tag">{% icon "calendar" %}{{ f.region_obj.name }}</span></div>
  <div class="card__body">
    <div class="card__meta"><span>{{ f.place_obj.name }}</span>{% if f.name_ne %}<span class="deva" style="text-transform:none;font-size:.95rem;letter-spacing:0">{{ f.name_ne }}</span>{% endif %}</div>
    <h3>{{ f.name }}</h3>
    <p class="small"><b>{{ f.when }}</b></p>
  </div>
</a>
