{% load yatra %}<a class="card" href="{{ d.url }}"{% if d.land %} data-land="{{ d.land }}"{% endif %}>
  <div class="card__img">{% with i=d|first_img %}{% if i %}<img src="{{ i|src:500 }}" alt="" loading="lazy">{% else %}<div class="noimg">{% icon "book" %}</div>{% endif %}{% endwith %}<span class="card__tag">{% icon "book" %}{{ d.category }}</span></div>
  <div class="card__body">
    <div class="card__meta"><span>{{ d.date_obj|date:"j M Y" }}</span><b>{{ d.read_min }} min read</b></div>
    <h3>{{ d.title }}</h3>
    <p>{{ d.summary|truncatewords:22 }}</p>
  </div>
</a>
